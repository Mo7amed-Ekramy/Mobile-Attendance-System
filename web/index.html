<!DOCTYPE html>
<html lang="ar">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#5A3824">
  <meta name="description" content="نظام الحضور والتقييم الأكاديمي لجامعة أسيوط الأهلية">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="الحضور الجامعي">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>جامعة أسيوط الأهلية · الحضور والتقييم</title>
  <style>
    body { margin: 0; background: #F8F6F2; }
    #app-loading { position: fixed; inset: 0; display: grid; place-content: center;
      justify-items: center; gap: 20px; color: #5A3824; font: 15px system-ui, sans-serif; }
    #app-loading img { width: 88px; height: 88px; object-fit: contain; }
    #app-loading progress { width: 120px; accent-color: #5A3824; height: 5px; }
  </style>
</head>
<body>
  <div id="app-loading" role="status" aria-label="جار تحميل التطبيق">
    <img src="assets/assets/images/logo.png" alt="جامعة أسيوط الأهلية">
    <span>نظام الحضور والتقييم الأكاديمي</span>
    <progress aria-label="جار التحميل"></progress>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
